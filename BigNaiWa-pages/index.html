<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff3e0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="合成大奶娃">
<meta name="description" content="合成大奶娃 · 纯前端小游戏：拖动瞄准、松手投放，相同的撞在一起合成更大的一只。">
<!-- ↓ Monetag 站点验证：把后台给的 meta 标签粘在下面这一行 ↓ -->

<title>合成大奶娃</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

  <!-- ===== 游戏区 ===== -->
  <section class="stage" id="stage">
    <canvas id="game" aria-label="合成大奶娃游戏区域"></canvas>

    <div class="overlay" id="overlay">
      <div class="dialog">
        <div class="dialog-emoji">🍉</div>
        <h2 id="overTitle">游戏结束</h2>
        <p class="dialog-score">本局得分 <strong id="finalScore">0</strong></p>
        <p class="dialog-best">最高分 <span id="finalBest">0</span></p>

        <!-- 榜单已屏蔽（结算提交 + 结算页的排行榜入口）。
             要恢复：去掉下面这一整段注释标记，并把文件末尾 leaderboard.min.js 的注释放开。 -->
        <!--
        <div class="submit-box" id="submitBox">
          <p class="submit-msg" id="submitMsg">正在结算…</p>
          <p class="my-name">昵称：<strong id="myNameLabel">默认用户</strong>
            <button class="link-btn" id="editNameBtn" type="button">改昵称</button>
          </p>
          <button class="btn" id="submitBtn" type="button" hidden>重试提交</button>
        </div>
        -->

        <div class="dialog-actions">
          <!--
          <button class="btn" id="boardBtn2" type="button">🏆 排行榜</button>
          -->
          <button class="btn btn-primary" id="restartBtn" type="button">再来一局</button>
        </div>
        <p class="dialog-hint">按 R 键也可重新开始</p>
      </div>
    </div>
  </section>

  <!-- ===== 侧边面板 ===== -->
  <aside class="panel">

    <header class="panel-head">
      <h1>合成大奶娃</h1>
      <p class="subtitle">相同的撞在一起，越合越大</p>
    </header>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">分数</span>
        <strong class="stat-value" id="score">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">最高分</span>
        <strong class="stat-value stat-best" id="best">0</strong>
      </div>
    </div>

    <div class="next-box">
      <span class="box-label">下一个</span>
      <canvas id="next" width="160" height="160" aria-label="下一个"></canvas>
    </div>

    <div class="chain-box">
      <span class="box-label">合成表</span>
      <canvas id="chain" width="680" height="112" aria-label="合成顺序"></canvas>
    </div>

    <div class="actions">
      <!-- 榜单已屏蔽：要恢复去掉这层注释 -->
      <!--
      <button class="btn btn-wide" id="boardBtn" type="button">
        <span class="ico">🏆</span><span class="lbl">排行榜</span>
      </button>
      -->
      <button class="btn" id="soundBtn" type="button" aria-pressed="true">
        <span class="ico">🔊</span><span class="lbl">音效开</span>
      </button>
      <button class="btn btn-primary" id="resetBtn" type="button" title="重新开始">
        <span class="ico">↻</span><span class="lbl">重开</span>
      </button>
    </div>

    <p class="tips">
      鼠标：移动瞄准、点击投放；触屏：拖动瞄准、松手投放。<br>
      ← → 微调位置，空格投放，R 重开。
    </p>

  </aside>

</main>

<!-- ===== 榜单弹窗（已屏蔽）=====
<div class="modal" id="boardModal" aria-hidden="true" role="dialog" aria-label="排行榜">
  <div class="modal-card">
    <header class="modal-head">
      <h2>🏆 最近高手榜</h2>
      <button class="icon-btn" id="boardClose" type="button" aria-label="关闭">✕</button>
    </header>
    <div class="nick-row">
      <label class="nick-label" for="nickInput">我的昵称</label>
      <input class="nick-input" id="nickInput" type="text" maxlength="12"
             placeholder="默认用户" autocomplete="nickname" enterkeyhint="done">
    </div>
    <div class="board-list" id="boardList"></div>
    <footer class="modal-foot">
      <span class="board-note">只取最近 20 次提交，成绩会被后来的人挤下去</span>
      <button class="btn" id="boardRefresh" type="button">刷新</button>
    </footer>
  </div>
</div>
===== 要恢复：去掉本行和上面开头的注释标记 ===== -->

<script src="assets/fruits/parts.js"></script>
<script src="game.js"></script>

<script src="leaderboard.min.js"></script>
-->
</body>
</html>
